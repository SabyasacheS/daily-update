name: Daily Update

on:
  schedule:
    - cron: "17 2 * * *"        # 02:17 UTC = 05:17 Doha
  repository_dispatch:
    types: [watchlist-updated]  # sent by the Watchlist page: refresh the site, no email
  workflow_dispatch:
    inputs:
      email:
        description: "Send the email? (auto = only on send days, once a day)"
        type: choice
        options: [auto, "yes", "no"]
        default: "no"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04       # pinned: ubuntu-latest moved to a new version on 19 Oct 2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries for the PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b

      - name: Install
        run: pip install -r requirements.txt

      - name: Build the report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          MODE="auto"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then MODE="no"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.email }}"; fi
          python -m pipeline.run --email "$MODE"

      - name: Publish
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs data
          if git diff --staged --quiet; then echo "Nothing to publish"; exit 0; fi
          git commit -q -m "Daily Update $(date -u +%Y-%m-%d) (${{ github.event_name }})"
          # Pages are rebuilt from scratch every run, so if another run saved first,
          # keep this run's newer version instead of stopping on a conflict.
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
